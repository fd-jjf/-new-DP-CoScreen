[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-coscreen"
version = "1.0.0"
description = "Differentially Private Orthogonal Feature Screening for Industrial IoT Data"
authors = [
    { name = "DP-CoScreen Authors" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "threadpoolctl>=3.1.0"
]
